[project]
name = "earbook"
version = "0.1.0"
description = "Traduz ebooks para ouvir no ElevenReader, com o Claude Code no comando."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "lxml>=5",
    "pdfminer-six>=20251230",  # abaixo disso: CVE-2025-64512 e CVE-2025-70559
]

[project.scripts]
earbook = "earbook.comandos.cli:principal"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "import-linter>=2.15",
    "pytest>=8",
    "ruff>=0.6",
    "types-lxml>=2026.2.16",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

# Trilho python-on-rails (ADR-0002). Afrouxar qualquer linha daqui é desvio: exige ADR.

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Lista explícita, não "ALL": regra nova do ruff entra por decisão, não por upgrade.
select = [
  "F", "E", "W", "I", "N", "UP",   # base: erros, estilo, imports, nomes, sintaxe moderna
  "ANN",                           # anotação em toda função; ANN401 proíbe Any
  "S",                             # segurança (bandit): eval, shell=True, senha no código, pickle
  "BLE", "TRY", "EM",              # exceção: nada de except amplo, raise from, mensagem útil
  "B", "A", "ARG", "RET", "SIM", "PIE", "C4", "PERF", "FURB", "FLY", "ISC", "RUF",
  "DTZ",                           # datetime sem fuso
  "T10", "T20",                    # debugger e print esquecidos
  "LOG", "G",                      # logging bem usado
  "PT",                            # pytest idiomático
  "PTH",                           # pathlib
  "ERA",                           # código comentado
  "PGH",                           # supressão sem código de regra
  "TID",                           # imports absolutos
  "ASYNC",                         # bloqueio dentro de async
  "FBT",                           # bool posicional (f(True) não diz nada)
  "PL", "C90",                     # complexidade e armadilhas do pylint
]
ignore = [
  "TRY003",  # mensagem longa na exceção é o que queremos: valor recebido e formato esperado
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401"]  # assert, número mágico e Any de fixture em teste
"src/earbook/comandos/cli.py" = ["T201"]  # ADR-0002: o CLI é a camada de interface com humano

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Config lida num lugar só: fora do config.py, ler o ambiente reprova. Repassar o ambiente a um
# subprocesso é legítimo e leva `# noqa: TID251  # motivo: ...`.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."
"os.environb".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."
"os.getenv".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."
"os.getenvb".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."

[tool.basedpyright]
typeCheckingMode = "recommended"  # o modo mais estrito pensado para uso diário
pythonVersion = "3.14"            # igual ao .python-version
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = false  # só `# pyright: ignore[regra]`, que diz qual regra cala
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
failOnWarnings = true             # sem isso, warning sai com código 0 e o agente segue

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true          # xfail que passa reprova: não vira esconderijo
testpaths = ["tests"]
filterwarnings = ["error"]   # depreciação vira falha hoje, não quebra amanhã

# ADR-0001: a dependência aponta para dentro, e o domínio não conhece biblioteca de borda.
[tool.importlinter]
root_package = "earbook"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "camadas: comandos → adaptadores → domínio"
type = "layers"
layers = ["earbook.comandos", "earbook.adaptadores", "earbook.dominio"]

[[tool.importlinter.contracts]]
name = "domínio não conhece biblioteca de borda"
type = "forbidden"
source_modules = ["earbook.dominio"]
forbidden_modules = ["lxml", "pdfminer"]

# ADR-0004: a biblioteca de PDF só entra por adaptadores/pdf.py.
[[tool.importlinter.contracts]]
name = "comandos não conhecem a biblioteca de PDF"
type = "forbidden"
source_modules = ["earbook.comandos"]
forbidden_modules = ["pdfminer", "lxml"]
allow_indirect_imports = true  # o caminho permitido é comandos → adaptadores → biblioteca
